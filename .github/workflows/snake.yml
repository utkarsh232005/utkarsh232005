name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: utkarsh232005
          outputs: dist/github-contribution-grid-snake.svg

      - name: Push snake to output branch
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git switch -c output || git switch output
          cp -rf dist/* .
          git add .
          git commit -m "Update snake animation" || echo "Nothing to commit"
          git push --set-upstream origin output
