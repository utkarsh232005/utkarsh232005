name: Update Open Source Dashboard

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install jq
        run: sudo apt-get install jq

      - name: Fetch merged PRs
        run: |
          curl -s "https://api.github.com/search/issues?q=author:utkarsh232005+type:pr+is:merged&per_page=5" > merged_prs.json

      - name: Fetch active PRs
        run: |
          curl -s "https://api.github.com/search/issues?q=author:utkarsh232005+type:pr+is:open&per_page=5" > active_prs.json

      - name: Generate dashboard
        run: |
          echo "### 🚀 Recent Open Source Contributions" > dashboard.md
          echo "" >> dashboard.md

          echo "#### ✅ Merged Pull Requests" >> dashboard.md
          jq -r '.items[] | "- [" + .title + "](" + .html_url + ") in **" + (.repository_url | split("/") | .[-2] + "/" + .[-1]) + "**"' merged_prs.json >> dashboard.md

          echo "" >> dashboard.md
          echo "#### 🔄 Active Pull Requests" >> dashboard.md
          jq -r '.items[] | "- [" + .title + "](" + .html_url + ") in **" + (.repository_url | split("/") | .[-2] + "/" + .[-1]) + "**"' active_prs.json >> dashboard.md

          echo "" >> dashboard.md
          echo "_Last updated: $(date)_ " >> dashboard.md

      - name: Update README
        run: |
          awk '/<!--START_SECTION:oss-contributions-->/{print;system("cat dashboard.md");flag=1;next}/<!--END_SECTION:oss-contributions-->/{flag=0} !flag' README.md > newREADME.md
          mv newREADME.md README.md

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add README.md
          git commit -m "Update open source dashboard" || echo "No changes"
          git push
