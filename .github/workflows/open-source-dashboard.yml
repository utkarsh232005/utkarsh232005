name: Update Open Source Dashboard

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install jq

      - name: Fetch merged PRs
        run: |
          curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/search/issues?q=author:utkarsh232005+type:pr+is:merged&per_page=5" > merged_prs.json

      - name: Fetch active PRs
        run: |
          curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/search/issues?q=author:utkarsh232005+type:pr+is:open&per_page=5" > active_prs.json

      - name: Ensure filter files exist
        run: |
          touch .github/dashboard-include-prs.txt
          touch .github/dashboard-exclude-prs.txt

      - name: Apply manual PR filters
        run: |
          jq \
            --rawfile include .github/dashboard-include-prs.txt \
            --rawfile exclude .github/dashboard-exclude-prs.txt \
            '
            def clean_lines($s):
              $s
              | split("\n")
              | map(gsub("^\\s+|\\s+$"; ""))
              | map(select(length > 0 and (startswith("#") | not)));

            (clean_lines($include)) as $allow
            | (clean_lines($exclude)) as $deny
            | .items = ((.items // []) | map(
                . as $pr
                | select(
                    (($deny | index($pr.html_url)) == null)
                    and (($allow | length) == 0 or ($allow | index($pr.html_url)) != null)
                  )
              ))
            ' merged_prs.json > merged_prs_filtered.json

          jq \
            --rawfile include .github/dashboard-include-prs.txt \
            --rawfile exclude .github/dashboard-exclude-prs.txt \
            '
            def clean_lines($s):
              $s
              | split("\n")
              | map(gsub("^\\s+|\\s+$"; ""))
              | map(select(length > 0 and (startswith("#") | not)));

            (clean_lines($include)) as $allow
            | (clean_lines($exclude)) as $deny
            | .items = ((.items // []) | map(
                . as $pr
                | select(
                    (($deny | index($pr.html_url)) == null)
                    and (($allow | length) == 0 or ($allow | index($pr.html_url)) != null)
                  )
              ))
            ' active_prs.json > active_prs_filtered.json

      - name: Generate dashboard
        run: |
          echo "### 🚀 Recent Open Source Contributions" > dashboard.md
          echo "" >> dashboard.md

          echo "#### ✅ Merged Pull Requests" >> dashboard.md
          jq -r '(.items // []) | if length == 0 then "- No merged PRs found." else .[] | "- [" + .title + "](" + .html_url + ") in **" + (.repository_url | split("/") | .[-2] + "/" + .[-1]) + "**" end' merged_prs_filtered.json >> dashboard.md

          echo "" >> dashboard.md
          echo "#### 🔄 Active Pull Requests" >> dashboard.md
          jq -r '(.items // []) | if length == 0 then "- No active PRs found." else .[] | "- [" + .title + "](" + .html_url + ") in **" + (.repository_url | split("/") | .[-2] + "/" + .[-1]) + "**" end' active_prs_filtered.json >> dashboard.md

          echo "" >> dashboard.md
          echo "_Last updated: $(date)_ " >> dashboard.md

      - name: Update README
        run: |
          awk '/<!--START_SECTION:oss-contributions-->/{print;system("cat dashboard.md");flag=1;next}/<!--END_SECTION:oss-contributions-->/{flag=0} !flag' README.md > newREADME.md
          mv newREADME.md README.md

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add README.md
          git commit -m "Update open source dashboard" || echo "No changes"
          git push
