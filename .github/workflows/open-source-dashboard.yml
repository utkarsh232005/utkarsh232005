name: Update Open Source Dashboard

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Fetch merged PRs
        run: |
          > all_prs.jsonl

          echo "Fetching authored merged PRs..."

          for PAGE in {1..10}; do
            curl -s \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/search/issues?q=author:utkarsh232005+type:pr+is:merged&per_page=100&page=${PAGE}" \
              | jq '.items[]?' >> all_prs.jsonl
          done

          echo "Fetching explicitly included repositories..."

          while IFS= read -r repo; do
            repo=$(echo "$repo" | xargs)

            if [[ -z "$repo" || "$repo" =~ ^# ]]; then
              continue
            fi

            echo "Processing $repo"

            for PAGE in {1..5}; do
              curl -s \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/search/issues?q=repo:${repo}+author:utkarsh232005+type:pr+is:merged&per_page=100&page=${PAGE}" \
                | jq '.items[]?' >> all_prs.jsonl
            done

          done < dashboard-include-repos.txt

          jq -s '
          {
            items:
            (
              .
              | unique_by(.html_url)
              | sort_by(.closed_at)
              | reverse
            )
          }
          ' all_prs.jsonl > merged_prs.json

          echo "Total merged PRs:"
          jq '.items | length' merged_prs.json

          echo "Repositories found:"
          jq -r '
            .items[]
            | (.repository_url | split("/") | .[-2] + "/" + .[-1])
          ' merged_prs.json | sort -u

      - name: Fetch active PRs
        run: |
          curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/search/issues?q=author:utkarsh232005+type:pr+is:open&per_page=100" > active_prs.json

      - name: Fetch open issues
        run: |
          curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/search/issues?q=author:utkarsh232005+type:issue+is:open&per_page=5" > open_issues.json

      - name: Fetch closed issues
        run: |
          curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/search/issues?q=author:utkarsh232005+type:issue+is:closed&per_page=5" > closed_issues.json

      - name: Ensure filter files exist
        run: |
          touch dashboard-include-repos.txt
          touch dashboard-include-prs.txt
          touch dashboard-exclude-prs.txt
          touch dashboard-exclude-repos.txt

      - name: Apply manual PR filters
        run: |
          jq \
            --rawfile include_repos dashboard-include-repos.txt \
            --rawfile include dashboard-include-prs.txt \
            --rawfile exclude dashboard-exclude-prs.txt \
            --rawfile exclude_repos dashboard-exclude-repos.txt \
            '
            def clean_lines($s):
              $s | split("\n")
              | map(gsub("^\\s+|\\s+$"; ""))
              | map(select(length > 0 and (startswith("#") | not)))
              | map(ascii_downcase);

            def repo_name($pr):
              ($pr.repository_url | split("/") | .[-2] + "/" + .[-1] | ascii_downcase);

            def norm_url($u):
              ($u | split("?") | .[0] | split("#") | .[0] | gsub("/+$"; "") | ascii_downcase);

            def pr_match($entry; $pr):
              ($entry == norm_url($pr.html_url))
              or ($entry == ($pr.number | tostring))
              or ($entry == (repo_name($pr) + "#" + ($pr.number | tostring)))
              or ($entry == (repo_name($pr) + "/pull/" + ($pr.number | tostring)));

            (clean_lines($include_repos)) as $allow_repos
            | (clean_lines($include)) as $allow
            | (clean_lines($exclude)) as $deny
            | (clean_lines($exclude_repos)) as $deny_repos
            | .items = ((.items // []) | map(
                . as $pr
                | select(
                    (($allow_repos | length) == 0 or (($allow_repos | index(repo_name($pr))) != null))
                    and (($deny_repos | index(repo_name($pr))) == null)
                    and (($deny | any(pr_match(.; $pr))) | not)
                    and (($allow | length) == 0 or ($allow | any(pr_match(.; $pr))))
                  )
              ))
            ' merged_prs.json > merged_prs_filtered.json

          jq \
            --rawfile include_repos dashboard-include-repos.txt \
            --rawfile include dashboard-include-prs.txt \
            --rawfile exclude dashboard-exclude-prs.txt \
            --rawfile exclude_repos dashboard-exclude-repos.txt \
            '
            def clean_lines($s):
              $s | split("\n")
              | map(gsub("^\\s+|\\s+$"; ""))
              | map(select(length > 0 and (startswith("#") | not)))
              | map(ascii_downcase);

            def repo_name($pr):
              ($pr.repository_url | split("/") | .[-2] + "/" + .[-1] | ascii_downcase);

            def norm_url($u):
              ($u | split("?") | .[0] | split("#") | .[0] | gsub("/+$"; "") | ascii_downcase);

            def pr_match($entry; $pr):
              ($entry == norm_url($pr.html_url))
              or ($entry == ($pr.number | tostring))
              or ($entry == (repo_name($pr) + "#" + ($pr.number | tostring)))
              or ($entry == (repo_name($pr) + "/pull/" + ($pr.number | tostring)));

            (clean_lines($include_repos)) as $allow_repos
            | (clean_lines($include)) as $allow
            | (clean_lines($exclude)) as $deny
            | (clean_lines($exclude_repos)) as $deny_repos
            | .items = ((.items // []) | map(
                . as $pr
                | select(
                    (($allow_repos | length) == 0 or (($allow_repos | index(repo_name($pr))) != null))
                    and (($deny_repos | index(repo_name($pr))) == null)
                    and (($deny | any(pr_match(.; $pr))) | not)
                    and (($allow | length) == 0 or ($allow | any(pr_match(.; $pr))))
                  )
              ))
            ' active_prs.json > active_prs_filtered.json

          jq \
            --rawfile exclude_repos dashboard-exclude-repos.txt \
            '
            def clean_lines($s):
              $s | split("\n")
              | map(gsub("^\\s+|\\s+$"; ""))
              | map(select(length > 0 and (startswith("#") | not)))
              | map(ascii_downcase);

            def repo_name($i):
              ($i.repository_url | split("/") | .[-2] + "/" + .[-1] | ascii_downcase);

            (clean_lines($exclude_repos)) as $deny_repos
            | .items = ((.items // []) | map(
                . as $issue
                | select(($deny_repos | index(repo_name($issue))) == null)
              ))
            ' open_issues.json > open_issues_filtered.json

          jq \
            --rawfile exclude_repos dashboard-exclude-repos.txt \
            '
            def clean_lines($s):
              $s | split("\n")
              | map(gsub("^\\s+|\\s+$"; ""))
              | map(select(length > 0 and (startswith("#") | not)))
              | map(ascii_downcase);

            def repo_name($i):
              ($i.repository_url | split("/") | .[-2] + "/" + .[-1] | ascii_downcase);

            (clean_lines($exclude_repos)) as $deny_repos
            | .items = ((.items // []) | map(
                . as $issue
                | select(($deny_repos | index(repo_name($issue))) == null)
              ))
            ' closed_issues.json > closed_issues_filtered.json

      - name: Generate dashboard
        run: |
          python3 scripts/generate_dashboard.py

      - name: Update README
        run: |
          awk '/<!--START_SECTION:oss-contributions-->/{print;system("cat dashboard.md");flag=1;next}/<!--END_SECTION:oss-contributions-->/{flag=0} !flag' README.md > newREADME.md
          mv newREADME.md README.md

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add README.md
          git commit -m "Update open source dashboard" || echo "No changes"
          git push
